name: Transfer upstream Git objects
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream release and preserve original history
        run: |
          git fetch https://github.com/chthollyphile/folia-major.git refs/tags/v0.7.22:refs/tags/v0.7.22
          git bundle create upstream-v0.7.22.bundle ^67fb072a50a665cdf9ab52e0b0d21d29b8acf4bf refs/tags/v0.7.22
          git bundle verify upstream-v0.7.22.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-git-objects
          path: upstream-v0.7.22.bundle
          retention-days: 3
